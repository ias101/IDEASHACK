function AIAudit() {
  const DEMO = `Title: Bio-Degradable Polymer Solar Cells with 18.3% Efficiency\n\nAbstract: We present a novel photovoltaic material composed of 92% biodegradable polymer substrates combined with earth-abundant donor-acceptor conjugated polymers. Lab-scale devices demonstrate 18.3% power conversion efficiency under AM1.5G illumination. The polymer matrix enables full biodegradation within 24 months under controlled composting conditions, addressing critical end-of-life concerns for conventional silicon panels.`;
  const STEPS = ['Parsing research content...','Extracting technical claims...','Cross-referencing market data...','Running risk rule engine...','Generating structured audit report...'];
  const [input, setInput] = useState('');
  const [phase, setPhase] = useState('idle');
  const [step, setStep] = useState(0);
  const [expRisk, setExpRisk] = useState(null);
  const [expApp, setExpApp] = useState(null);

  const run = () => {
    if (!input.trim()) return;
    setPhase('loading'); setStep(0);
    const t = setInterval(() => setStep(p => { if(p>=STEPS.length-1){clearInterval(t);setTimeout(()=>setPhase('result'),400);return p;} return p+1; }), 600);
  };

  return (
    <div className="max-w-4xl mx-auto space-y-5 fade-in">
      <div>
        <h1 className="text-xl font-bold text-white mb-1 flex items-center gap-2">✨ AI Commercialization Audit</h1>

        <span className="text-indigo-400 text-xs mt-0.5">ℹ️</span>
        <p className="text-xs text-gray-400"><span className="text-indigo-300 font-medium">Explainability-first: </span>Every output includes a reasoning trace. No black-box scores. All conclusions can be audited and appealed.</p>
      </div>

      {phase==='idle' && (
        <div className="space-y-4">
          <textarea value={input} onChange={e=>setInput(e.target.value)} placeholder="Paste your research title and abstract here..." rows={8}

          <div className="flex items-center gap-3">
            <button onClick={run} disabled={!input.trim()} className="flex items-center gap-2 px-5 py-2.5 bg-indigo-600 hover:bg-indigo-500 disabled:opacity-40 disabled:cursor-not-allowed text-white text-sm font-semibold rounded-xl transition-colors">
              ✨ Run AI Audit

                return (
                  <div key={i} className={`border rounded-xl overflow-hidden ${s.bg}`}>
                    <button onClick={()=>setExpRisk(expRisk===i?null:i)} className="w-full flex items-center gap-3 px-4 py-3 text-left">
                      <Chip cls={s.badge}>{r.lv}</Chip>
                      <span className="text-sm font-medium text-gray-200 flex-1">{r.risk}</span>
                      <span className="text-gray-500">{expRisk===i?'▲':'▼'}</span>
                    </button>
                    {expRisk===i && <div className="px-4 pb-3 border-t border-gray-800/50"><p className="text-xs text-gray-400 mt-2 leading-relaxed">{r.detail}</p></div>}
                  </div>
                );
              })}
            </div>
          </Card>

          <Card cls="p-5">
            <h3 className="text-sm font-semibold text-white mb-4 flex items-center gap-2"><span className="w-1.5 h-1.5 rounded-full bg-emerald-400"></span>Recommended Validation Actions</h3>
            <div className="space-y-3">
              {AUDIT_RESULT.actions.map((a,i) => (
                <div key={i} className="flex items-start gap-3">
                  <div className="w-5 h-5 rounded-full bg-indigo-500/20 border border-indigo-500/30 flex items-center justify-center flex-shrink-0 mt-0.5">
                    <span className="text-xs font-bold text-indigo-400">{i+1}</span>
                  </div>
                  <p className="text-sm text-gray-300 leading-relaxed">{a}</p>
                </div>
              ))}
            </div>
          </Card>

          <div className="flex items-center gap-2 px-4 py-3 bg-gray-900 border border-gray-800 rounded-xl">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#34d399" strokeWidth="2"><path d="M22 11.08V12a10 10 0 11-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
            <span className="text-xs text-gray-500">Audit result logged to Trust Ledger with full reasoning trace. Event ID: TL-{Math.floor(Math.random()*900000+100000)}</span>
          </div>
        </div>
      )}
    </div>
  );
}

/* ─── TRUST LEDGER ─── */
function TrustLedger() {
  const [typeFilter, setTypeFilter] = useState('ALL');
  const [vrFilter, setVrFilter] = useState('ALL');
  const types = ['ALL','ROOM_CREATED','MEMBER_JOIN','STAGE_CHANGE','MILESTONE_COMPLETE','AI_AUDIT','IP_REGISTERED'];
  const filtered = LEDGER.filter(e => (typeFilter==='ALL'||e.type===typeFilter) && (vrFilter==='ALL'||e.vid===vrFilter));

  return (
    <div className="max-w-5xl mx-auto space-y-5 fade-in">
      <div>
        <div className="flex items-center gap-2 mb-1">
          <h1 className="text-xl font-bold text-white">🔒 Trust Ledger</h1>
          <Chip cls="bg-emerald-500/20 text-emerald-300 border border-emerald-500/30">Append-only</Chip>
        </div>
        <p className="text-gray-500 text-sm">Every platform action is immutably recorded here. No edits, no deletions — this is the single source of truth.</p>
      </div>

      <div className="grid grid-cols-4 gap-3">
        {[{l:'Total Events',v:LEDGER.length,c:'text-white'},{l:'Stage Changes',v:LEDGER.filter(e=>e.type==='STAGE_CHANGE').length,c:'text-emerald-400'},{l:'AI Audits',v:LEDGER.filter(e=>e.type==='AI_AUDIT').length,c:'text-violet-400'},{l:'IP Events',v:LEDGER.filter(e=>e.type==='IP_REGISTERED').length,c:'text-amber-400'}].map(({l,v,c})=>(
          <Card key={l} cls="px-4 py-3 text-center">
            <div className={`text-xl font-bold ${c}`}>{v}</div>
            <div className="text-xs text-gray-600 mt-0.5">{l}</div>
          </Card>
        ))}
      </div>

      <div className="flex items-center gap-3 flex-wrap">
        <span className="text-xs text-gray-500">Filter:</span>
        <div className="flex items-center gap-1 flex-wrap">
          {types.map(t => (
            <button key={t} onClick={()=>setTypeFilter(t)} className={`px-3 py-1 rounded-full text-xs font-medium transition-colors ${typeFilter===t?'bg-indigo-600 text-white':'bg-gray-800 text-gray-400 hover:bg-gray-700 hover:text-gray-200'}`}>
              {t==='ALL'?'All Types':EVT_LABEL[t]||t}
            </button>
          ))}
        </div>
        <div className="h-4 w-px bg-gray-800"></div>
        {['ALL','vr-001','vr-002'].map(v => (
          <button key={v} onClick={()=>setVrFilter(v)} className={`px-3 py-1 rounded-full text-xs font-medium transition-colors ${vrFilter===v?'bg-gray-600 text-white':'bg-gray-800 text-gray-400 hover:bg-gray-700 hover:text-gray-200'}`}>
            {v==='ALL'?'All Ventures':v.toUpperCase()}
          </button>
        ))}
        <span className="ml-auto text-xs text-gray-600">{filtered.length} events</span>
      </div>

      <div className="flex items-center gap-2 px-4 py-2.5 bg-gray-900 border border-gray-800 rounded-xl">
        <span className="text-amber-400 text-xs">🔒</span>
        <span className="text-xs text-gray-500">This ledger is <span className="text-amber-300">append-only</span>. No UPDATE or DELETE operations permitted. Each event carries a trace-id and actor attribution.</span>
      </div>

      <Card cls="overflow-hidden">
        <div className="grid px-5 py-3 border-b border-gray-800 text-xs text-gray-600 font-medium uppercase tracking-wider" style={{gridTemplateColumns:'3rem 3.5rem 1fr 7rem 9rem'}}>
          <div>Type</div><div>ID</div><div>Detail</div><div>Actor</div><div>Timestamp</div>
        </div>
        <div className="divide-y divide-gray-800/60">
          {filtered.map(e => (
            <div key={e.id} className="grid px-5 py-4 hover:bg-gray-800/30 transition-colors items-center gap-4" style={{gridTemplateColumns:'3rem 3.5rem 1fr 7rem 9rem'}}>
              <div className={`w-7 h-7 rounded-lg ${EVT_STYLE[e.type]} flex items-center justify-center text-xs`}>●</div>
              <span className="text-xs font-mono text-gray-600">{e.id}</span>
              <div>
                <p className="text-sm text-gray-200 leading-snug">{e.detail}</p>
                {e.from&&e.to&&<div className="flex items-center gap-1.5 mt-1"><span className="text-xs text-gray-600 bg-gray-800 px-1.5 py-0.5 rounded">{e.from}</span><span className="text-gray-700 text-xs">→</span><span className="text-xs text-emerald-400 bg-emerald-500/10 px-1.5 py-0.5 rounded">{e.to}</span></div>}
              </div>
              <div>
                <p className="text-xs font-medium text-gray-300">{e.actor}</p>
                <p className="text-xs text-gray-600">{e.role}</p>
              </div>
              <span className="text-xs text-gray-500 font-mono leading-tight">{fmtDateTime(e.ts)}</span>
            </div>
          ))}
        </div>
        {filtered.length===0&&<div className="py-12 text-center text-gray-600 text-sm">No events match the current filters.</div>}
      </Card>
      <p className="text-xs text-gray-700 text-center pb-4">End of ledger · {LEDGER.length} total events · Cryptographic hash chain available in production</p>
    </div>
  );
}

/* ─── PASSPORT ─── */
function Passport({user}) {
  const p = PASSPORTS[user.id] || PASSPORTS['u-001'];
  const grad = ROLE_GRAD[p.role];
  return (
    <div className="max-w-4xl mx-auto space-y-5 fade-in">
      <Card cls="overflow-hidden">
        <div className="h-24 opacity-30" style={{background:`linear-gradient(to right,${p.role==='Researcher'?'#8b5cf6,#7c3aed':p.role==='Business'?'#3b82f6,#0891b2':'#f59e0b,#ea580c'})`}}></div>
        <div className="px-6 pb-6">
          <div className="flex items-end gap-5 -mt-10 mb-5">
            <div className={`w-20 h-20 rounded-2xl bg-gradient-to-br ${grad} flex items-center justify-center text-white text-2xl font-bold border-4 border-gray-900 shadow-xl`}>{p.avatar}</div>
            <div className="pb-1">
              <h1 className="text-xl font-bold text-white">{p.name}</h1>
              <p className="text-gray-400 text-sm">{p.title}</p>
              <p className="text-xs text-gray-500 mt-1">🏛 {p.inst} · {p.dept}</p>
            </div>
          </div>
          <div className="flex items-center gap-2 flex-wrap mb-4">
            {p.verifiedBy.map(s => (
              <div key={s} className="flex items-center gap-1.5 px-3 py-1.5 bg-emerald-500/10 border border-emerald-500/20 rounded-full">
                <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#34d399" strokeWidth="2.5"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
                <span className="text-xs text-emerald-300 font-medium">Verified · {s}</span>
              </div>
            ))}
          </div>
          <div className="grid grid-cols-5 gap-3">
            {[{l:'Stages Progressed',v:p.metrics.stages,c:'text-emerald-400'},{l:'Milestones Delivered',v:p.metrics.milestones,c:'text-blue-400'},{l:'IP Filings',v:p.metrics.ip,c:'text-amber-400'},{l:'Active Collaborations',v:p.metrics.collabs,c:'text-violet-400'},{l:'Trust Events',v:p.metrics.events,c:'text-indigo-400'}].map(({l,v,c})=>(
              <div key={l} className="bg-gray-800/60 border border-gray-700/50 rounded-xl px-3 py-3 text-center">
                <div className={`text-lg font-bold text-white`}>{v}</div>
                <div className="text-xs text-gray-600 leading-tight mt-0.5">{l}</div>
              </div>
            ))}
          </div>
        </div>
      </Card>

      <div className="grid grid-cols-5 gap-5">
        <div className="col-span-3 space-y-5">
          <Card cls="p-5">
            <div className="flex items-center gap-2 mb-3">
              <span className="text-sm font-semibold text-white">✨ AI Collaboration Style</span>
              <span className="ml-auto text-xs text-gray-600">Evidence-based · Not a score</span>
            </div>
            <div className="bg-violet-500/5 border border-violet-500/15 rounded-xl p-4">
              <p className="text-sm text-gray-300 leading-relaxed">{p.style}</p>
            </div>
            <p className="text-xs text-gray-600 mt-3">🔒 Derived from Trust Ledger events and verified collaboration history. No black-box scoring.</p>
          </Card>

          <Card cls="p-5">
            <p className="text-sm font-semibold text-white mb-4">👥 Collaboration History</p>
            {VENTURES.filter(v=>v.members.some(m=>m.name===p.name||VENTURES[0].members[0].name===p.name)).slice(0,1).map(v=>(
              <div key={v.id} className="border border-gray-800 rounded-xl p-4">
                <p className="text-sm font-medium text-white mb-1">{v.title}</p>
                <p className="text-xs text-gray-500 mb-2">Lead Researcher · Aug 2024 — Present</p>
                <div className="flex items-center gap-2">
                  <Chip cls={STAGE_BADGE[v.stage]}>{v.stage}</Chip>
                  <span className="text-xs text-emerald-400 font-medium">Active</span>
                </div>
              </div>
            ))}
          </Card>
        </div>

        <div className="col-span-2 space-y-5">
          {p.pubs > 0 && (
            <Card cls="p-5">
              <p className="text-sm font-semibold text-white mb-4">📚 Academic Profile</p>
              <div className="space-y-3">
                {[{l:'Publications',v:p.pubs},{l:'h-index',v:p.hIndex},{l:'Total Citations',v:p.citations?.toLocaleString()}].filter(x=>x.v).map(({l,v})=>(
                  <div key={l} className="flex items-center justify-between py-2 border-b border-gray-800 last:border-0">
                    <span className="text-xs text-gray-500">{l}</span><span className="text-sm font-semibold text-white">{v}</span>
                  </div>
                ))}
              </div>
            </Card>
          )}
          <div className="bg-indigo-900/20 border border-indigo-500/20 rounded-2xl p-5">
            <p className="text-sm font-semibold text-indigo-300 mb-3">🏆 Trust Summary</p>
            {[{l:'Identity',s:'Verified',c:'text-emerald-400'},{l:'Collaboration record',s:'On-chain',c:'text-emerald-400'},{l:'AI style assessment',s:'Completed',c:'text-emerald-400'},{l:'IP attribution',s:p.metrics.ip>0?'Registered':'None',c:p.metrics.ip>0?'text-amber-400':'text-gray-600'}].map(({l,s,c})=>(
              <div key={l} className="flex items-center justify-between mb-2"><span className="text-xs text-gray-500">{l}</span><span className={`text-xs font-medium ${c}`}>{s}</span></div>
            ))}
          </div>
          <Card cls="px-4 py-3 text-center">
            <p className="text-xs text-gray-600">Member since</p>
            <p className="text-sm font-semibold text-gray-300 mt-0.5">July 2024</p>
          </Card>
        </div>
      </div>
    </div>
  );
}

/* ─── APP ─── */
function App() {
  const [screen, setScreen] = useState('landing'); // landing | login | app
  const [user, setUser] = useState(null);
  const [page, setPage] = useState('dashboard');
  const [selectedVenture, setSelectedVenture] = useState('vr-001');

  const handleLogin = (key) => { setUser(USERS[key]); setScreen('app'); setPage('dashboard'); };
  const handleLogout = () => { setUser(null); setScreen('landing'); };

  if (screen==='landing') return <Landing onEnter={()=>setScreen('login')} />;
  if (screen==='login') return <Login onLogin={handleLogin} onBack={()=>setScreen('landing')} />;

  return (
    <div className="flex h-screen overflow-hidden" style={{background:'#030712'}}>
      <Sidebar page={page} setPage={setPage} user={user} onLogout={handleLogout} />
      <div className="flex flex-col flex-1 overflow-hidden">
        <TopBar user={user} />
        <main className="flex-1 overflow-y-auto p-6">
          {page==='dashboard' && <Dashboard setPage={setPage} setSelectedVenture={setSelectedVenture} />}
          {page==='venture'   && <VentureRoom ventureId={selectedVenture} setPage={setPage} />}
          {page==='audit'     && <AIAudit />}
          {page==='ledger'    && <TrustLedger />}
          {page==='passport'  && <Passport user={user} />}
        </main>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
